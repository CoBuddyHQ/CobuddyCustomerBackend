# =============================================================
# CoBuddy Customer Backend — Docker Compose (Development)
# Usage:
#   docker compose -f docker-compose.dev.yml up -d --build
# =============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: cobuddy_customer_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cobuddy_customer_db}
      POSTGRES_USER: ${POSTGRES_USER:-cobuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-secret-password-2026}
    ports:
      - "5433:5432"
    volumes:
      - cobuddy_customer_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobuddy} -d ${POSTGRES_DB:-cobuddy_customer_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cobuddy_customer_network_dev

  redis:
    image: redis:7-alpine
    container_name: cobuddy_customer_redis_dev
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - cobuddy_customer_redis_data_dev:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cobuddy_customer_network_dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobuddy_customer_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-cobuddy}:${POSTGRES_PASSWORD:-development-secret-password-2026}@postgres:5432/${POSTGRES_DB:-cobuddy_customer_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-cobuddy-customer-super-secret-jwt-key-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cobuddy-customer-super-secret-refresh-key-2026}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TLCpKIamWxQBYy}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-w2l3tVjYk6aH4zM9xQ8pL7nR}
      OTP_DEV_BYPASS: ${OTP_DEV_BYPASS:-123456}
      CORS_ORIGIN: "*"
    ports:
      - "4002:4002"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./uploads:/app/uploads
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cobuddy_customer_network_dev

volumes:
  cobuddy_customer_postgres_data_dev:
    driver: local
  cobuddy_customer_redis_data_dev:
    driver: local

networks:
  cobuddy_customer_network_dev:
    driver: bridge
    name: cobuddy_customer_network_dev
